name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Corepack must own the `yarn` shim before setup-node's `cache: yarn`
      # probe runs: the probe calls `yarn --version`, and the runner's global
      # Yarn 1.22 refuses to run in a repo pinning "packageManager": "yarn@4.x".
      # setup-node has no pre-cache hook, so it runs twice -- once to put Node
      # on PATH, then again once Corepack is active and the probe detects Berry.
      # The second call re-uses the Node from the first, so it costs ~a second.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn

      - run: yarn install --immutable

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

  e2e:
    name: Cypress e2e
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Corepack must own the `yarn` shim before setup-node's `cache: yarn`
      # probe runs: the probe calls `yarn --version`, and the runner's global
      # Yarn 1.22 refuses to run in a repo pinning "packageManager": "yarn@4.x".
      # setup-node has no pre-cache hook, so it runs twice -- once to put Node
      # on PATH, then again once Corepack is active and the probe detects Berry.
      # The second call re-uses the Node from the first, so it costs ~a second.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn

      - run: yarn install --immutable

      - name: Start dev server + run Cypress
        run: yarn cypress:run
